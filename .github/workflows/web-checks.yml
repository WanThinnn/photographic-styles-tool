name: Browser regression checks
on:
  push:
    paths: ['web/**', 'tests/web/**', 'tools/**', '.github/workflows/web-checks.yml']
  pull_request:
    paths: ['web/**', 'tests/web/**', 'tools/**', '.github/workflows/web-checks.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/web/check-i18n.mjs
      - run: node tests/web/check-pwa.mjs
      - run: node --test tests/web/depth-refinement.mjs
      - run: node --test tests/web/startup.mjs tests/web/lifecycle.mjs tests/web/ai-portrait.mjs tests/web/ai-portrait-export.mjs tests/web/apple-depth.mjs tests/web/heic-worker.mjs tests/web/style-preservation.mjs tests/web/texture-compatibility.mjs tests/web/soft-skin.mjs tests/web/face-refinement.mjs tests/web/raster-import.mjs tests/web/jpeg-hdr.mjs tests/web/dng-import.mjs tests/web/language.mjs tests/web/photo-date.mjs tests/web/live-photo.mjs tests/web/thumbnail-graph.mjs
