<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Next-generation Photographic Styles</title>
<meta name="description" content="Adds the Photographic Styles palette, introduced with iPhone 16, to HEIC photos from earlier iPhones, plus the Texture and Grain controls on iOS 27. Runs entirely in your browser; photos are never uploaded.">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f5f6f8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111317" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Style Port">
<meta property="og:title" content="Next-generation Photographic Styles">
<meta property="og:description" content="Adds the Photographic Styles palette, introduced with iPhone 16, to HEIC photos from earlier iPhones, plus the Texture and Grain controls on iOS 27. Runs entirely in your browser; photos are never uploaded.">
<meta property="og:type" content="website">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/svg+xml" href="icons/photographic-styles.svg">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<main>
  <header class="top">
    <img class="logo" src="icons/photographic-styles.svg" width="36" height="36" alt="" aria-hidden="true">
    <div class="title">
      <h1 data-i18n="meta.title">Next-generation Photographic Styles</h1>
      <span class="tagline" data-i18n="app.tagline"></span>
    </div>
    <label class="language">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.8 2.5 15.2 0 18M12 3c-2.5 2.8-2.5 15.2 0 18"/></svg>
      <span class="sr-only" data-i18n="lang.label">Language</span>
      <select id="lang"><option value="vi">Tiếng Việt</option><option value="en">English</option><option value="zh">中文</option></select>
    </label>
  </header>

  <section class="intro">
    <h2><span data-i18n="app.hero"></span></h2>
    <p class="sub" data-i18n="app.lede"></p>
  </section>

  <div class="workspace">
  <div id="drop" role="button" tabindex="0" aria-disabled="true">
    <div class="drop-icon" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="3"/><circle cx="8.5" cy="10" r="1.6"/><path d="m21 16-5-5-8 8"/></svg>
    </div>
    <strong data-i18n="drop.big"></strong>
    <span data-i18n="drop.small"></span>
  </div>
  <input type="file" id="file" multiple disabled
         accept="image/heic,image/heif,image/jpeg,image/png,image/webp,image/gif,image/bmp,image/avif,image/x-adobe-dng,video/quicktime,.heic,.heif,.jpg,.jpeg,.png,.webp,.gif,.bmp,.avif,.dng,.mov">

  <div class="options-grid">
  <div class="opts card">
    <input type="checkbox" id="quality" role="switch" checked>
    <label for="quality" data-i18n="opt.quality"></label>
  </div>
  <div class="opts card">
    <input type="checkbox" id="ai-portrait" role="switch" aria-describedby="ai-portrait-hint">
    <label for="ai-portrait" id="ai-portrait-label"></label>
  </div>
  </div>
  <p id="ai-portrait-hint" class="ai-hint" hidden></p>
  <p class="ai-hint" data-i18n="hint.softskin"></p>
  </div>

  <div class="history-actions">
    <h2 data-i18n="h.history"></h2>
    <button id="clear-history" class="history-clear" type="button" hidden>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2M5 6l1 14a1 1 0 0 0 1 1h10a1 1 0 0 0 1-1l1-14M10 10v7M14 10v7"/></svg>
      <span data-i18n="btn.clearhistory"></span>
    </button>
  </div>
  <div id="list" aria-live="polite"></div>
  <p id="boot"></p>

  <details class="help">
    <summary data-i18n="h.help"></summary>
    <div class="help-content">
      <section><h2 data-i18n="h.steps"></h2><p data-i18n="help.steps"></p><p data-i18n="tip.body"></p></section>
      <section><h2 data-i18n="h.formats"></h2><p data-i18n="help.formats"></p><p data-i18n="help.original"></p><p data-i18n="help.live"></p></section>
      <section><h2 data-i18n="h.editlimits"></h2><p data-i18n="help.editlimits"></p><p data-i18n="help.portraitlimits"></p></section>
      <section><h2 data-i18n="h.trouble"></h2><p data-i18n="help.slow"></p><p data-i18n="t.date"></p></section>
      <section><p data-i18n="n.1"></p><p data-i18n="help.language"></p></section>
    </div>
  </details>

  <footer><span data-i18n="p.author"></span> · <span data-i18n="p.version"></span> <span id="version"></span> · <a href="https://github.com/WanThinnn/photographic-styles-tool">GitHub</a></footer>
</main>
<script type="module" src="app.js"></script>
</body>
</html>
